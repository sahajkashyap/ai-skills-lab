<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1310" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <!-- the robot -->
    <g id="bot">
      <line x1="-28" y1="-118" x2="-38" y2="-148" stroke="#8f3d10" stroke-width="7" stroke-linecap="round"/>
      <line x1="28" y1="-118" x2="38" y2="-148" stroke="#8f3d10" stroke-width="7" stroke-linecap="round"/>
      <circle cx="-40" cy="-152" r="9" fill="#c98a4b" stroke="#8f3d10" stroke-width="5"/>
      <circle cx="40" cy="-152" r="9" fill="#c98a4b" stroke="#8f3d10" stroke-width="5"/>
      <rect x="-74" y="-102" width="14" height="30" rx="6" fill="#c98a4b" stroke="#8f3d10" stroke-width="5"/>
      <rect x="60" y="-102" width="14" height="30" rx="6" fill="#c98a4b" stroke="#8f3d10" stroke-width="5"/>
      <rect x="-62" y="-122" width="124" height="86" rx="16" fill="#b5541c"/>
      <rect x="-50" y="-112" width="100" height="66" rx="10" fill="#fffdf7"/>
      <rect x="-52" y="-32" width="104" height="88" rx="16" fill="#fffdf7" stroke="#8f3d10" stroke-width="6"/>
      <rect x="-30" y="-14" width="60" height="38" rx="8" fill="#fdf1dc" stroke="#8f3d10" stroke-width="5"/>
      <circle cx="18" cy="-4" r="4" fill="#8f3d10"/>
      <rect x="-38" y="56" width="24" height="34" rx="10" fill="#fffdf7" stroke="#8f3d10" stroke-width="6"/>
      <rect x="14" y="56" width="24" height="34" rx="10" fill="#fffdf7" stroke="#8f3d10" stroke-width="6"/>
    </g>
    <g id="face-reading">
      <circle cx="-20" cy="-84" r="6" fill="#4a2c17"/>
      <circle cx="20" cy="-84" r="6" fill="#4a2c17"/>
      <path d="M -12 -66 Q 0 -58 12 -66" fill="none" stroke="#4a2c17" stroke-width="5" stroke-linecap="round"/>
    </g>
    <g id="face-happy">
      <path d="M -26 -86 Q -20 -94 -14 -86" fill="none" stroke="#4a2c17" stroke-width="5" stroke-linecap="round"/>
      <path d="M 14 -86 Q 20 -94 26 -86" fill="none" stroke="#4a2c17" stroke-width="5" stroke-linecap="round"/>
      <path d="M -14 -68 Q 0 -56 14 -68" fill="none" stroke="#4a2c17" stroke-width="5" stroke-linecap="round"/>
    </g>
    <!-- a sheet of paper with text lines -->
    <g id="paper">
      <rect x="-34" y="-46" width="68" height="92" rx="6" fill="#fffdf7" stroke="#8f3d10" stroke-width="5"/>
      <line x1="-20" y1="-26" x2="20" y2="-26" stroke="#c98a4b" stroke-width="5" stroke-linecap="round"/>
      <line x1="-20" y1="-8" x2="20" y2="-8" stroke="#c98a4b" stroke-width="5" stroke-linecap="round"/>
      <line x1="-20" y1="10" x2="12" y2="10" stroke="#c98a4b" stroke-width="5" stroke-linecap="round"/>
      <line x1="-20" y1="28" x2="18" y2="28" stroke="#c98a4b" stroke-width="5" stroke-linecap="round"/>
    </g>
    <!-- the human: standing, face + hair + shirt -->
    <g id="human">
      <rect x="-20" y="26" width="17" height="36" rx="8" fill="#8f3d10" stroke="#4a2c17" stroke-width="3.5"/>
      <rect x="3" y="26" width="17" height="36" rx="8" fill="#8f3d10" stroke="#4a2c17" stroke-width="3.5"/>
      <path d="M -26 66 Q -26 58 -18 58 L -3 58 L -3 70 L -26 70 Z" fill="#4a2c17"/>
      <path d="M 3 70 L 3 58 L 18 58 Q 26 58 26 66 L 26 70 Z" fill="#4a2c17"/>
      <path d="M -30 -44 Q -32 -50 -24 -51 L 24 -51 Q 32 -50 30 -44 L 27 22 Q 26 30 18 30 L -18 30 Q -26 30 -27 22 Z"
            fill="#2f6b5e" stroke="#4a2c17" stroke-width="4"/>
      <rect x="-7" y="-62" width="14" height="14" rx="5" fill="#eebd93" stroke="#4a2c17" stroke-width="3"/>
      <circle cx="-25" cy="-84" r="6" fill="#eebd93" stroke="#4a2c17" stroke-width="3"/>
      <circle cx="25" cy="-84" r="6" fill="#eebd93" stroke="#4a2c17" stroke-width="3"/>
      <circle cx="0" cy="-84" r="25" fill="#eebd93" stroke="#4a2c17" stroke-width="3.5"/>
      <path d="M -25 -91 Q -26 -110 0 -110 Q 26 -110 25 -91 Q 15 -101 4 -100 Q -8 -101 -25 -91 Z"
            fill="#5b3a1e" stroke="#4a2c17" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="-9" cy="-85" r="3" fill="#4a2c17"/>
      <circle cx="9" cy="-85" r="3" fill="#4a2c17"/>
      <path d="M -7 -71 Q 0 -66 7 -71" fill="none" stroke="#4a2c17" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <!-- panel frame -->
    <g id="frame">
      <rect x="0" y="0" width="590" height="380" rx="18" fill="#fdf6e3" stroke="#b5541c" stroke-width="6"/>
    </g>
  </defs>

  <!-- ===================== PANEL 1: AI reads ===================== -->
  <g transform="translate(10,10)">
    <use href="#frame"/>
    <g transform="translate(210,205)">
      <use href="#bot"/><use href="#face-reading"/>
      <g transform="translate(120,6) rotate(4)">
        <rect x="-40" y="-70" width="80" height="150" rx="8" fill="#fffdf7" stroke="#8f3d10" stroke-width="6"/>
        <path d="M -40 -70 Q -40 -88 -22 -86 L 40 -86 L 40 -70 Z" fill="#f1e3c8" stroke="#8f3d10" stroke-width="5"/>
        <line x1="-24" y1="-48" x2="24" y2="-48" stroke="#c98a4b" stroke-width="5" stroke-linecap="round"/>
        <line x1="-24" y1="-26" x2="24" y2="-26" stroke="#c98a4b" stroke-width="5" stroke-linecap="round"/>
        <line x1="-24" y1="-4" x2="16" y2="-4" stroke="#c98a4b" stroke-width="5" stroke-linecap="round"/>
        <line x1="-24" y1="18" x2="22" y2="18" stroke="#c98a4b" stroke-width="5" stroke-linecap="round"/>
        <line x1="-24" y1="40" x2="10" y2="40" stroke="#c98a4b" stroke-width="5" stroke-linecap="round"/>
        <line x1="-24" y1="62" x2="18" y2="62" stroke="#c98a4b" stroke-width="5" stroke-linecap="round"/>
      </g>
      <path d="M 50 6 Q 76 6 88 2" fill="none" stroke="#8f3d10" stroke-width="12" stroke-linecap="round"/>
    </g>
    <text x="295" y="352" text-anchor="middle" font-size="26" font-weight="bold" letter-spacing="2" fill="#8f3d10">1 · AI READS IT ALL</text>
  </g>

  <!-- ===================== PANEL 2: hands it over ===================== -->
  <g transform="translate(640,10)">
    <use href="#frame"/>
    <g transform="translate(150,205)">
      <use href="#bot"/><use href="#face-happy"/>
      <path d="M 52 -6 Q 92 -18 122 -22" fill="none" stroke="#8f3d10" stroke-width="12" stroke-linecap="round"/>
      <g transform="translate(165,-20) rotate(8) scale(0.8)"><use href="#paper"/></g>
    </g>
    <path d="M 322 150 Q 378 128 428 150" fill="none" stroke="#c98a4b" stroke-width="7" stroke-dasharray="2 14" stroke-linecap="round"/>
    <path d="M 428 150 l -20 -12 m 20 12 l -24 6" fill="none" stroke="#c98a4b" stroke-width="7" stroke-linecap="round"/>
    <g transform="translate(462,225) scale(1.35)">
      <use href="#human"/>
      <path d="M -26 -38 Q -50 -46 -64 -40" fill="none" stroke="#eebd93" stroke-width="12" stroke-linecap="round"/>
    </g>
    <text x="295" y="352" text-anchor="middle" font-size="26" font-weight="bold" letter-spacing="2" fill="#8f3d10">2 · HANDS IT TO A PERSON</text>
  </g>

  <!-- ===================== PANEL 3: the person reviews it ===================== -->
  <g transform="translate(10,450)">
    <use href="#frame"/>
    <g transform="translate(270,225)">
      <!-- lounger -->
      <path d="M -95 60 L -95 -10 Q -95 -26 -79 -26 L -60 -26 L -60 34 L 92 34 L 92 60 Q 92 74 78 74 L -81 74 Q -95 74 -95 60 Z" fill="#e9d9b8" stroke="#8f3d10" stroke-width="6"/>
      <rect x="-60" y="26" width="152" height="14" rx="7" fill="#c98a4b" stroke="#8f3d10" stroke-width="5"/>
      <!-- reclined person with face and hair -->
      <circle cx="-30" cy="-48" r="22" fill="#eebd93" stroke="#4a2c17" stroke-width="3.5"/>
      <path d="M -52 -54 Q -53 -70 -30 -70 Q -7 -70 -8 -54 Q -18 -63 -28 -62 Q -40 -63 -52 -54 Z"
            fill="#5b3a1e" stroke="#4a2c17" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="-37" cy="-49" r="2.8" fill="#4a2c17"/>
      <circle cx="-22" cy="-49" r="2.8" fill="#4a2c17"/>
      <path d="M -35 -38 Q -30 -34 -24 -38" fill="none" stroke="#4a2c17" stroke-width="2.5" stroke-linecap="round"/>
      <!-- glasses -->
      <circle cx="-37" cy="-49" r="8" fill="none" stroke="#8f3d10" stroke-width="3"/>
      <circle cx="-21" cy="-49" r="8" fill="none" stroke="#8f3d10" stroke-width="3"/>
      <line x1="-29" y1="-49" x2="-28" y2="-49" stroke="#8f3d10" stroke-width="3"/>
      <!-- reclined body in shirt -->
      <path d="M -48 -26 Q -18 -38 8 -22 L 34 2 Q 44 12 34 24 L -6 24 L -46 24 Q -56 8 -48 -26 Z" fill="#2f6b5e" stroke="#4a2c17" stroke-width="4"/>
      <path d="M -6 24 L 66 16 Q 78 15 78 26 L 78 32 L -6 32 Z" fill="#8f3d10" stroke="#4a2c17" stroke-width="3"/>
      <!-- paper held up + skin arm -->
      <g transform="translate(52,-56) rotate(-14) scale(0.9)"><use href="#paper"/></g>
      <path d="M 4 -10 Q 28 -28 42 -42" fill="none" stroke="#eebd93" stroke-width="13" stroke-linecap="round"/>
      <!-- pencil in the other hand: reviewing, not just reading -->
      <line x1="76" y1="-34" x2="94" y2="-16" stroke="#c98a4b" stroke-width="7" stroke-linecap="round"/>
      <path d="M 94 -16 l 8 8 l -11 -2 Z" fill="#8f3d10"/>
    </g>
    <text x="295" y="352" text-anchor="middle" font-size="26" font-weight="bold" letter-spacing="2" fill="#8f3d10">3 · THE PERSON REVIEWS IT</text>
  </g>

  <!-- ===================== PANEL 4: an agent checks the facts ===================== -->
  <g transform="translate(640,450)">
    <use href="#frame"/>
    <g transform="translate(230,215) scale(0.9)">
      <use href="#bot"/><use href="#face-reading"/>
      <path d="M 50 0 Q 72 0 82 -6" fill="none" stroke="#8f3d10" stroke-width="11" stroke-linecap="round"/>
      <!-- document under the magnifier -->
      <g transform="translate(140,-14)">
        <use href="#paper"/>
        <circle cx="14" cy="-6" r="30" fill="none" stroke="#8f3d10" stroke-width="8"/>
        <line x1="36" y1="17" x2="60" y2="41" stroke="#8f3d10" stroke-width="10" stroke-linecap="round"/>
      </g>
    </g>
    <!-- verified sources ticking in -->
    <g transform="translate(430,120)">
      <rect x="-46" y="-34" width="92" height="68" rx="10" fill="#fffdf7" stroke="#8f3d10" stroke-width="5"/>
      <path d="M -18 0 L -4 14 L 24 -18" fill="none" stroke="#175e54" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(480,235)">
      <rect x="-46" y="-34" width="92" height="68" rx="10" fill="#fffdf7" stroke="#8f3d10" stroke-width="5"/>
      <path d="M -18 0 L -4 14 L 24 -18" fill="none" stroke="#175e54" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="295" y="352" text-anchor="middle" font-size="26" font-weight="bold" letter-spacing="2" fill="#8f3d10">4 · A SECOND AI CHECKS THE FACTS</text>
  </g>

  <!-- ===================== PANEL 5 (wide): the person reads it last ===================== -->
  <g transform="translate(10,890)">
    <rect x="0" y="0" width="1220" height="380" rx="18" fill="#fdf6e3" stroke="#b5541c" stroke-width="6"/>
    <!-- person reading, front and center -->
    <g transform="translate(400,215) scale(1.5)">
      <use href="#human"/>
      <!-- holding the paper at chest height, face visible -->
      <path d="M -26 -36 Q -40 -30 -42 -14" fill="none" stroke="#eebd93" stroke-width="12" stroke-linecap="round"/>
      <path d="M 26 -36 Q 40 -30 42 -14" fill="none" stroke="#eebd93" stroke-width="12" stroke-linecap="round"/>
      <g transform="translate(0,-4) scale(0.8)"><use href="#paper"/></g>
    </g>
    <!-- big okay bubble -->
    <g transform="translate(760,140)">
      <path d="M -70 -50 Q -70 -78 -42 -78 L 70 -78 Q 98 -78 98 -50 L 98 6 Q 98 34 70 34 L -20 34 L -48 62 L -42 34 Q -70 34 -70 6 Z" fill="#fffdf7" stroke="#8f3d10" stroke-width="6"/>
      <path d="M -28 -18 L -4 6 L 44 -46" fill="none" stroke="#175e54" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- happy robots, waiting on the verdict together -->
    <g transform="translate(950,235) scale(0.8)">
      <use href="#bot"/><use href="#face-happy"/>
    </g>
    <g transform="translate(1105,265) scale(0.55)">
      <use href="#bot"/><use href="#face-happy"/>
    </g>
    <text x="610" y="352" text-anchor="middle" font-size="26" font-weight="bold" letter-spacing="2" fill="#8f3d10">5 · THE PERSON READS IT LAST. THE FINAL OKAY IS HUMAN.</text>
  </g>
</svg>
