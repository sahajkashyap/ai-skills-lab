<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700">
  <!-- ================= THE SILICON MAN (golden metal man, chip where the heart goes) ================= -->
  <g transform="translate(280,330)">
    <!-- legs -->
    <rect x="-62" y="160" width="34" height="90" rx="14" fill="#e9b458" stroke="#8f3d10" stroke-width="7"/>
    <rect x="28" y="160" width="34" height="90" rx="14" fill="#e9b458" stroke="#8f3d10" stroke-width="7"/>
    <circle cx="-45" cy="165" r="12" fill="#c98a4b" stroke="#8f3d10" stroke-width="5"/>
    <circle cx="45" cy="165" r="12" fill="#c98a4b" stroke="#8f3d10" stroke-width="5"/>
    <path d="M -74 250 Q -74 238 -62 238 L -20 238 Q -12 238 -12 248 L -12 258 L -74 258 Z" fill="#c98a4b" stroke="#8f3d10" stroke-width="6"/>
    <path d="M 16 250 Q 16 238 28 238 L 70 238 Q 78 238 78 248 L 78 258 L 16 258 Z" fill="#c98a4b" stroke="#8f3d10" stroke-width="6"/>

    <!-- torso -->
    <path d="M -78 -30 Q -84 -40 -74 -44 L 74 -44 Q 84 -40 78 -30 L 64 150 Q 62 166 46 166 L -46 166 Q -62 166 -64 150 Z"
          fill="#e9b458" stroke="#8f3d10" stroke-width="8"/>
    <!-- rivets -->
    <circle cx="-58" cy="-26" r="6" fill="#8f3d10"/>
    <circle cx="58" cy="-26" r="6" fill="#8f3d10"/>
    <circle cx="-48" cy="138" r="6" fill="#8f3d10"/>
    <circle cx="48" cy="138" r="6" fill="#8f3d10"/>
    <!-- metal shine -->
    <path d="M -52 -20 Q -58 60 -46 130" fill="none" stroke="#fff3d6" stroke-width="10" stroke-linecap="round" opacity="0.7"/>

    <!-- where the heart would be: a dashed heart outline, with a chip inside -->
    <g transform="translate(8,40)">
      <path d="M 0 44 C -50 6 -30 -40 0 -16 C 30 -40 50 6 0 44 Z"
            fill="none" stroke="#8f3d10" stroke-width="6" stroke-dasharray="4 12" stroke-linecap="round"/>
      <rect x="-24" y="-12" width="48" height="34" rx="5" fill="#b5541c" stroke="#8f3d10" stroke-width="5"/>
      <line x1="-24" y1="-4" x2="-38" y2="-4" stroke="#8f3d10" stroke-width="4"/>
      <line x1="-24" y1="6" x2="-38" y2="6" stroke="#8f3d10" stroke-width="4"/>
      <line x1="-24" y1="16" x2="-38" y2="16" stroke="#8f3d10" stroke-width="4"/>
      <line x1="24" y1="-4" x2="38" y2="-4" stroke="#8f3d10" stroke-width="4"/>
      <line x1="24" y1="6" x2="38" y2="6" stroke="#8f3d10" stroke-width="4"/>
      <line x1="24" y1="16" x2="38" y2="16" stroke="#8f3d10" stroke-width="4"/>
      <rect x="-13" y="-3" width="26" height="16" rx="3" fill="#fdf1dc" stroke="#8f3d10" stroke-width="3"/>
    </g>

    <!-- arms -->
    <circle cx="-84" cy="-18" r="16" fill="#c98a4b" stroke="#8f3d10" stroke-width="6"/>
    <rect x="-108" y="-12" width="30" height="86" rx="14" fill="#e9b458" stroke="#8f3d10" stroke-width="7"/>
    <circle cx="-93" cy="82" r="11" fill="#c98a4b" stroke="#8f3d10" stroke-width="5"/>
    <rect x="-106" y="88" width="26" height="66" rx="13" fill="#e9b458" stroke="#8f3d10" stroke-width="7"/>
    <circle cx="84" cy="-18" r="16" fill="#c98a4b" stroke="#8f3d10" stroke-width="6"/>
    <!-- right arm reaches gently toward the human -->
    <rect x="80" y="-14" width="88" height="28" rx="14" transform="rotate(24 84 -18)" fill="#e9b458" stroke="#8f3d10" stroke-width="7"/>
    <circle cx="166" cy="26" r="11" fill="#c98a4b" stroke="#8f3d10" stroke-width="5"/>
    <rect x="160" y="22" width="66" height="24" rx="12" transform="rotate(8 166 26)" fill="#e9b458" stroke="#8f3d10" stroke-width="7"/>

    <!-- neck + head -->
    <rect x="-16" y="-70" width="32" height="28" rx="8" fill="#c98a4b" stroke="#8f3d10" stroke-width="6"/>
    <rect x="-64" y="-172" width="128" height="108" rx="30" fill="#e9b458" stroke="#8f3d10" stroke-width="8"/>
    <path d="M -44 -160 Q -54 -120 -44 -84" fill="none" stroke="#fff3d6" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
    <!-- face: calm, a little wistful -->
    <circle cx="-24" cy="-126" r="7" fill="#4a2c17"/>
    <circle cx="24" cy="-126" r="7" fill="#4a2c17"/>
    <line x1="-12" y1="-96" x2="12" y2="-96" stroke="#4a2c17" stroke-width="5" stroke-linecap="round"/>
    <!-- side bolts -->
    <rect x="-78" y="-136" width="14" height="30" rx="6" fill="#c98a4b" stroke="#8f3d10" stroke-width="5"/>
    <rect x="64" y="-136" width="14" height="30" rx="6" fill="#c98a4b" stroke="#8f3d10" stroke-width="5"/>
  </g>

  <!-- ================= THE HUMAN, heart glowing (same height as the Silicon Man) ================= -->
  <g transform="translate(648,152)">
    <!-- legs + shoes -->
    <rect x="-40" y="278" width="34" height="122" rx="15" fill="#8f3d10" stroke="#4a2c17" stroke-width="5"/>
    <rect x="6" y="278" width="34" height="122" rx="15" fill="#8f3d10" stroke="#4a2c17" stroke-width="5"/>
    <path d="M -52 414 Q -52 398 -38 398 L -8 398 L -8 424 L -52 424 Z" fill="#4a2c17"/>
    <path d="M 8 414 Q 8 398 22 398 L 52 398 Q 52 398 52 410 L 52 424 L 8 424 Z" fill="#4a2c17" transform="scale(-1,1) translate(-60,0)"/>
    <path d="M 8 424 L 8 398 L 38 398 Q 52 398 52 414 L 52 424 Z" fill="#4a2c17"/>
    <!-- shirt torso -->
    <path d="M -60 136 Q -64 124 -50 122 L 50 122 Q 64 124 60 136 L 54 268 Q 53 282 38 282 L -38 282 Q -53 282 -54 268 Z"
          fill="#2f6b5e" stroke="#4a2c17" stroke-width="6"/>
    <!-- left arm (skin, short sleeve) -->
    <path d="M -56 140 L -74 150 L -80 200 Q -82 214 -70 216 L -60 216" fill="none" stroke="#2f6b5e" stroke-width="30" stroke-linecap="round"/>
    <path d="M -72 210 L -74 268" stroke="#eebd93" stroke-width="26" stroke-linecap="round"/>
    <!-- right arm reaching toward the Silicon Man -->
    <path d="M 56 142 L 76 156" stroke="#2f6b5e" stroke-width="30" stroke-linecap="round"/>
    <path d="M 80 160 L 118 184 L 148 196" fill="none" stroke="#eebd93" stroke-width="24" stroke-linecap="round"/>
    <!-- glow, then heart on the shirt -->
    <circle cx="0" cy="196" r="52" fill="#f7dfae" opacity="0.6"/>
    <circle cx="0" cy="196" r="34" fill="#f3cd87" opacity="0.7"/>
    <path d="M 0 226 C -42 194 -26 156 0 176 C 26 156 42 194 0 226 Z" fill="#b5541c" stroke="#4a2c17" stroke-width="5"/>
    <!-- neck -->
    <rect x="-12" y="102" width="24" height="26" rx="8" fill="#eebd93" stroke="#4a2c17" stroke-width="4"/>
    <!-- ears -->
    <circle cx="-50" cy="58" r="11" fill="#eebd93" stroke="#4a2c17" stroke-width="4"/>
    <circle cx="50" cy="58" r="11" fill="#eebd93" stroke="#4a2c17" stroke-width="4"/>
    <!-- head -->
    <circle cx="0" cy="58" r="50" fill="#eebd93" stroke="#4a2c17" stroke-width="5"/>
    <!-- hair -->
    <path d="M -50 44 Q -52 4 0 4 Q 52 4 50 44 Q 34 20 8 22 Q 12 12 2 10 Q 0 20 -12 24 Q -34 24 -50 44 Z"
          fill="#5b3a1e" stroke="#4a2c17" stroke-width="4" stroke-linejoin="round"/>
    <!-- face -->
    <circle cx="-17" cy="56" r="5.5" fill="#4a2c17"/>
    <circle cx="17" cy="56" r="5.5" fill="#4a2c17"/>
    <path d="M -24 44 Q -17 40 -10 44" fill="none" stroke="#4a2c17" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 10 44 Q 17 40 24 44" fill="none" stroke="#4a2c17" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 0 62 Q 3 70 -1 73" fill="none" stroke="#4a2c17" stroke-width="3" stroke-linecap="round"/>
    <path d="M -14 84 Q 0 94 14 84" fill="none" stroke="#4a2c17" stroke-width="4.5" stroke-linecap="round"/>
  </g>
</svg>
