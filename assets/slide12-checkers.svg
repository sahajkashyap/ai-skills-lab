<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 840" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <g id="bot12">
      <line x1="-24" y1="-104" x2="-32" y2="-128" stroke="#8f3d10" stroke-width="6" stroke-linecap="round"/>
      <line x1="24" y1="-104" x2="32" y2="-128" stroke="#8f3d10" stroke-width="6" stroke-linecap="round"/>
      <circle cx="-34" cy="-132" r="8" fill="#c98a4b" stroke="#8f3d10" stroke-width="4"/>
      <circle cx="34" cy="-132" r="8" fill="#c98a4b" stroke="#8f3d10" stroke-width="4"/>
      <rect x="-64" y="-88" width="12" height="26" rx="5" fill="#c98a4b" stroke="#8f3d10" stroke-width="4"/>
      <rect x="52" y="-88" width="12" height="26" rx="5" fill="#c98a4b" stroke="#8f3d10" stroke-width="4"/>
      <rect x="-54" y="-106" width="108" height="74" rx="14" fill="#b5541c"/>
      <rect x="-43" y="-97" width="86" height="56" rx="9" fill="#fffdf7"/>
      <circle cx="-17" cy="-73" r="5" fill="#4a2c17"/>
      <circle cx="17" cy="-73" r="5" fill="#4a2c17"/>
      <path d="M -10 -58 Q 0 -51 10 -58" fill="none" stroke="#4a2c17" stroke-width="4" stroke-linecap="round"/>
      <rect x="-45" y="-27" width="90" height="76" rx="14" fill="#fffdf7" stroke="#8f3d10" stroke-width="5"/>
      <rect x="-26" y="-11" width="52" height="32" rx="7" fill="#fdf1dc" stroke="#8f3d10" stroke-width="4"/>
      <rect x="-33" y="49" width="21" height="29" rx="9" fill="#fffdf7" stroke="#8f3d10" stroke-width="5"/>
      <rect x="12" y="49" width="21" height="29" rx="9" fill="#fffdf7" stroke="#8f3d10" stroke-width="5"/>
    </g>
    <g id="doc12">
      <rect x="-30" y="-40" width="60" height="80" rx="6" fill="#fffdf7" stroke="#8f3d10" stroke-width="5"/>
      <line x1="-17" y1="-22" x2="17" y2="-22" stroke="#c98a4b" stroke-width="4" stroke-linecap="round"/>
      <line x1="-17" y1="-7" x2="17" y2="-7" stroke="#c98a4b" stroke-width="4" stroke-linecap="round"/>
      <line x1="-17" y1="8" x2="10" y2="8" stroke="#c98a4b" stroke-width="4" stroke-linecap="round"/>
      <line x1="-17" y1="23" x2="14" y2="23" stroke="#c98a4b" stroke-width="4" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- ============ the big robot, top center ============ -->
  <g transform="translate(330,190) scale(1.25)">
    <use href="#bot12"/>
    <!-- arm pointing down to the team -->
    <path d="M 45 0 Q 66 14 70 34" fill="none" stroke="#8f3d10" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- speech bubble: go double-check -->
  <g transform="translate(640,120)">
    <path d="M -110 -62 Q -110 -90 -82 -90 L 120 -90 Q 148 -90 148 -62 L 148 10 Q 148 38 120 38 L -50 38 L -86 70 L -76 38 L -82 38 Q -110 38 -110 10 Z"
          fill="#fffdf7" stroke="#8f3d10" stroke-width="6"/>
    <text x="19" y="-38" text-anchor="middle" font-size="26" font-weight="bold" fill="#8f3d10">"Go double-check</text>
    <text x="19" y="2" text-anchor="middle" font-size="26" font-weight="bold" fill="#8f3d10">this report."</text>
  </g>

  <!-- dashed connectors down to the three checkers -->
  <path d="M 360 330 Q 250 420 195 480" fill="none" stroke="#c98a4b" stroke-width="6" stroke-dasharray="2 14" stroke-linecap="round"/>
  <path d="M 430 340 L 445 490" fill="none" stroke="#c98a4b" stroke-width="6" stroke-dasharray="2 14" stroke-linecap="round"/>
  <path d="M 500 330 Q 620 420 690 480" fill="none" stroke="#c98a4b" stroke-width="6" stroke-dasharray="2 14" stroke-linecap="round"/>

  <!-- ============ checker 1: sources (magnifier over doc) ============ -->
  <g transform="translate(160,610) scale(0.85)">
    <use href="#bot12"/>
    <g transform="translate(92,-6)">
      <use href="#doc12"/>
      <circle cx="18" cy="-8" r="26" fill="none" stroke="#8f3d10" stroke-width="7"/>
      <line x1="37" y1="12" x2="56" y2="32" stroke="#8f3d10" stroke-width="9" stroke-linecap="round"/>
    </g>
    <path d="M 44 4 Q 60 4 66 0" fill="none" stroke="#8f3d10" stroke-width="9" stroke-linecap="round"/>
  </g>
  <text x="180" y="810" text-anchor="middle" font-size="25" font-weight="bold" letter-spacing="2" fill="#8f3d10">THE SOURCES</text>

  <!-- ============ checker 2: numbers (dollar doc) ============ -->
  <g transform="translate(430,640) scale(0.85)">
    <use href="#bot12"/>
    <g transform="translate(90,-8)">
      <use href="#doc12"/>
      <circle cx="0" cy="-58" r="22" fill="#e9b458" stroke="#8f3d10" stroke-width="5"/>
      <text x="0" y="-48" text-anchor="middle" font-size="32" font-weight="bold" fill="#8f3d10">$</text>
    </g>
    <path d="M 44 4 Q 58 4 64 0" fill="none" stroke="#8f3d10" stroke-width="9" stroke-linecap="round"/>
  </g>
  <text x="450" y="810" text-anchor="middle" font-size="25" font-weight="bold" letter-spacing="2" fill="#8f3d10">THE NUMBERS</text>

  <!-- ============ checker 3: facts (checkmark doc) ============ -->
  <g transform="translate(700,610) scale(0.85)">
    <use href="#bot12"/>
    <g transform="translate(92,-6)">
      <use href="#doc12"/>
      <path d="M -14 -4 L -2 10 L 20 -20" fill="none" stroke="#175e54" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <path d="M 44 4 Q 60 4 66 0" fill="none" stroke="#8f3d10" stroke-width="9" stroke-linecap="round"/>
  </g>
  <text x="720" y="810" text-anchor="middle" font-size="25" font-weight="bold" letter-spacing="2" fill="#8f3d10">THE FACTS</text>
</svg>
